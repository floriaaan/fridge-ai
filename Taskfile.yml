version: '3'

vars:
  BACKEND: fridge-ai-backend
  MOBILE: fridge-ai-mobile

tasks:
  setup:
    desc: Install dependencies, copy .env files.
    cmds:
      - pnpm install
      - cmd: cp -n .env.example .env
        ignore_error: true
      - cmd: cp -n backend/.env.example backend/.env
        ignore_error: true
      - cmd: cp -n mobile/.env.example mobile/.env
        ignore_error: true

  dev:
    desc: Run the backend dev server locally (HMR), Postgres in Docker.
    deps: [dev:db]
    cmds:
      - task: dev:back

  dev:db:
    desc: Start only the Postgres container.
    cmds:
      - docker compose -f compose.yml up -d db

  dev:back:
    desc: Run the backend dev server locally (HMR).
    dir: backend
    cmds:
      - pnpm run dev

  dev:proxy:
    desc: Run the same-origin dev proxy (Caddy, :8080 → Metro :8081 + backend :3333/api) — point mobile web at this origin so the session cookie is never cross-site. Run alongside `task dev:back` and `task dev:mobile`.
    cmds:
      - caddy run --config dev/Caddyfile --adapter caddyfile

  db:migrate:
    desc: Run pending database migrations.
    dir: backend
    cmds:
      - node ace migration:run

  db:rollback:
    desc: Roll back the last migration batch.
    dir: backend
    cmds:
      - node ace migration:rollback

  db:reset:
    desc: Drop and re-migrate the database.
    dir: backend
    cmds:
      - node ace migration:fresh

  test:
    desc: Run backend tests (Japa).
    dir: backend
    cmds:
      - pnpm run test

  lint:
    desc: Lint the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run lint

  format:
    desc: Format the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run format

  typecheck:
    desc: Type-check the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run typecheck

  boundaries:
    desc: Enforce the domain/application/infrastructure/presentation dependency rule.
    cmds:
      - pnpm --filter {{.BACKEND}} run boundaries

  dev:mobile:
    desc: Run the Expo dev server.
    dir: mobile
    cmds:
      - pnpm run start

  lint:mobile:
    desc: Lint the mobile app.
    cmds:
      - pnpm --filter {{.MOBILE}} run lint

  typecheck:mobile:
    desc: Typecheck the mobile app.
    cmds:
      - pnpm --filter {{.MOBILE}} run typecheck

  test:mobile:
    desc: Run mobile tests (Jest).
    dir: mobile
    cmds:
      - pnpm run test

  boundaries:mobile:
    desc: Lint the mobile app's dependency boundaries.
    cmds:
      - pnpm --filter {{.MOBILE}} run boundaries

  check:
    desc: The CI command — lint + typecheck + tests + boundary lint, both packages.
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: boundaries
      - task: lint:mobile
      - task: typecheck:mobile
      - task: test:mobile
      - task: boundaries:mobile

  build:
    desc: Build the backend.
    cmds:
      - pnpm --filter {{.BACKEND}} run build

  up:
    desc: Start the production-like stack.
    cmds:
      - docker compose -f compose.yml up -d --build

  down:
    desc: Stop the stack.
    cmds:
      - docker compose -f compose.yml down

  logs:
    desc: Tail logs for the whole stack.
    cmds:
      - docker compose -f compose.yml logs -f

  up:app-only:
    desc: Start the app without the observability stack (db + backend only).
    cmds:
      - docker compose -f compose.yml up -d --build db backend

  obs:down:
    desc: Stop the observability stack, leaving the app running.
    cmds:
      - docker compose -f compose.yml stop otel-collector openobserve

  obs:logs:
    desc: Tail the collector's logs — where a rejected or misrouted export shows up.
    cmds:
      - docker compose -f compose.yml logs -f otel-collector
